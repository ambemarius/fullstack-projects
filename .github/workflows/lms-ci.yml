name: LMS CI

on:
  push:
    paths: ['LMS/**', '.github/workflows/lms-ci.yml']
  pull_request:
    paths: ['LMS/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LMS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LMS/package-lock.json
      - run: npm ci
      - run: npm test
